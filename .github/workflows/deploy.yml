name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Set in: Settings → Secrets and variables → Actions → Variables
          VITE_EMAIL_API_URL: ${{ vars.VITE_EMAIL_API_URL }}
          # Set to "/" in repository variables when using a custom domain
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}

      # SPA-style fallback + disable Jekyll processing
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
